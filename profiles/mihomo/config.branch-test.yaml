# RuleForge Mihomo branch test profile
# Replace the subscription URL placeholder below before use.
# Rule Providers point to the codex/mihomo-rules test branch.
# Quantumult X rewrite, MITM and scheduled-task sections have no equivalent here.

mixed-port: 7890
allow-lan: false
bind-address: "127.0.0.1"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: "127.0.0.1:9090"
secret: ""

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - "any:53"

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "time.*.com"
    - "ntp.*.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"

proxy-providers:
  subscription:
    type: http
    url: "https://example.invalid/REPLACE_WITH_YOUR_SUBSCRIPTION_URL"
    path: ./proxy_providers/subscription.yaml
    interval: 172800
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 600

