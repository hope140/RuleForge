[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleforge"
version = "0.1.0"
description = "Normalize, deduplicate, audit and render proxy rules."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ruleforge = "ruleforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
