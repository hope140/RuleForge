name: RuleForge 更新预检

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false

      - name: Check out the published baseline
        uses: actions/checkout@v7
        with:
          ref: main
          path: published
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Refresh upstream and compare both clients
        id: compare
        working-directory: candidate
        shell: bash
        run: |
          {
            printf '## 比较版本\n\n'
            printf -- '- 已发布基线（main）：`%s`\n' "$(git -C ../published rev-parse HEAD)"
            printf -- '- 预检所用代码：`%s`\n\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

          python tools/ruleforge.py preflight \
            --baseline "$GITHUB_WORKSPACE/published/outputs" \
            --report "$RUNNER_TEMP/ruleforge-preflight.md"

      - name: Show the report
        if: always()
        shell: bash
        env:
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          report="$RUNNER_TEMP/ruleforge-preflight.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$COMPARE_OUTCOME" != success ]]; then
            printf '预检未生成报告，请展开失败步骤查看原因。\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save the Markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruleforge-preflight
          path: ${{ runner.temp }}/ruleforge-preflight.md
          if-no-files-found: ignore
          retention-days: 7
