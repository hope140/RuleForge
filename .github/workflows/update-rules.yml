name: Update proxy rules

on:
  schedule:
    # 02:17 UTC = 10:17 China Standard Time (UTC+8), once per day.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-proxy-rules
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Refresh, build and audit Quantumult X rules
        run: >-
          python tools/ruleforge.py build
          --manifest sources/quantumultx.yaml
          --refresh
          --fail-on-conflict

      - name: Refresh, build and audit Mihomo rules
        run: >-
          python tools/ruleforge.py build
          --manifest sources/mihomo.yaml
          --refresh
          --fail-on-conflict

      - name: Install pinned Mihomo validator
        shell: bash
        run: |
          set -euo pipefail
          asset="mihomo-linux-amd64-compatible-v1.19.30.gz"
          url="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/${asset}"
          expected="db214c7a2517e63c150d123178d16d102e03a241ccdae4e5e07ffbe9cf56c6f9"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$asset" "$url"
          echo "$expected  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/$asset" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"

      - name: Validate Mihomo outputs and example profile
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t providers < <(find outputs/mihomo/categories/safe -maxdepth 1 -type f -name '*.list' | sort)
          test "${#providers[@]}" -eq 26
          if grep -RniE '^(host|host-suffix|host-keyword|host-wildcard|user-agent),' outputs/mihomo/categories/safe; then
            echo "Quantumult X or unsupported rules found in Mihomo outputs" >&2
            exit 1
          fi

          home="$RUNNER_TEMP/mihomo-home"
          mkdir -p "$home/rule_providers" "$home/proxy_providers"
          cp outputs/mihomo/categories/safe/*.list "$home/rule_providers/"
          printf '%s\n' 'proxies:' '  - { name: "Validation Node 1", type: http, server: 127.0.0.1, port: 8080 }' \
            > "$home/proxy_providers/provider-1.yaml"
          printf '%s\n' 'proxies:' '  - { name: "Validation Node 2", type: http, server: 127.0.0.1, port: 8081 }' \
            > "$home/proxy_providers/provider-2.yaml"
          "$RUNNER_TEMP/mihomo" -t -d "$home" -f "$GITHUB_WORKSPACE/profiles/mihomo/config.example.yaml"

          test -f outputs/mihomo/curation.json
          test -f outputs/quantumult-x/curation.json
          grep -q '^host-suffix,oaistatsig.com,AI$' outputs/quantumult-x/categories/safe/ai.list
          if grep -RniE '^(DOMAIN-SUFFIX|IP-ASN),(auth0\.com|algolia\.net|identrust\.com|intercom\.io|intercomcdn\.com|launchdarkly\.com|segment\.io|sentry\.io|stripe\.com|14061|20473)' outputs/mihomo/categories/safe/ai.list; then
            echo "Shared infrastructure curation leaked into Mihomo AI output" >&2
            exit 1
          fi
          if grep -RniE '^(host-suffix|ip-asn),(auth0\.com|algolia\.net|identrust\.com|intercom\.io|intercomcdn\.com|launchdarkly\.com|segment\.io|sentry\.io|stripe\.com|14061|20473)' outputs/quantumult-x/categories/safe/ai.list; then
            echo "Shared infrastructure curation leaked into Quantumult X AI output" >&2
            exit 1
          fi

      - name: Detect meaningful generated changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          # A newly generated category is always a meaningful change.
          if git ls-files --others --exclude-standard -- outputs/quantumult-x outputs/mihomo | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ignore timestamps only; rule, source hash, count and audit changes remain visible.
          if git diff --quiet \
            -I'^# Generated at ' \
            -I'^[[:space:]]*"generated_at_utc":' \
            -I'^[[:space:]]*"from_cache":' \
            -- outputs/quantumult-x outputs/mihomo; then
            git restore -- outputs/quantumult-x outputs/mihomo
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed rules
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/quantumult-x outputs/mihomo
          git commit -m "chore: update proxy rules"
          git push

      - name: Resolve published revision
        id: published_revision
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          test "${#revision}" -eq 40
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Verify published outputs at current revision
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          revision="${{ steps.published_revision.outputs.revision }}"
          test -n "$revision"
          download_dir="$(mktemp -d "$RUNNER_TEMP/published-exact-XXXXXX")"
          trap 'rm -rf "$download_dir"' EXIT

          verify_tree() {
            local kind="$1"
            local relative_dir="$2"
            local base="https://raw.githubusercontent.com/hope140/RuleForge/${revision}/${relative_dir}"
            local -a files
            mapfile -t files < <(find "$GITHUB_WORKSPACE/$relative_dir" -maxdepth 1 -type f -name '*.list' -print | sort)
            test "${#files[@]}" -eq 26
            for file in "${files[@]}"; do
              local name downloaded
              name="$(basename "$file")"
              downloaded="$download_dir/${kind}-${name}"
              curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 \
                --output "$downloaded" "$base/$name"
              cmp -- "$file" "$downloaded"
            done
          }

          verify_tree mihomo outputs/mihomo/categories/safe
          verify_tree qx outputs/quantumult-x/categories/safe

          filter="$GITHUB_WORKSPACE/outputs/quantumult-x/filter_remote.safe.conf"
          filter_download="$download_dir/qx-filter_remote.safe.conf"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 \
            --output "$filter_download" \
            "https://raw.githubusercontent.com/hope140/RuleForge/${revision}/outputs/quantumult-x/filter_remote.safe.conf"
          cmp -- "$filter" "$filter_download"

      - name: Verify public main aliases are readable
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d "$RUNNER_TEMP/published-alias-XXXXXX")"
          trap 'rm -rf "$download_dir"' EXIT

          verify_alias_tree() {
            local kind="$1"
            local relative_dir="$2"
            local base="https://raw.githubusercontent.com/hope140/RuleForge/main/${relative_dir}"
            local -a files
            mapfile -t files < <(find "$GITHUB_WORKSPACE/$relative_dir" -maxdepth 1 -type f -name '*.list' -print | sort)
            test "${#files[@]}" -eq 26
            for file in "${files[@]}"; do
              local name downloaded
              name="$(basename "$file")"
              downloaded="$download_dir/${kind}-${name}"
              curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 \
                --output "$downloaded" "$base/$name"
              test -s "$downloaded"
              grep -q '^# Category:' "$downloaded"
            done
          }

          verify_alias_tree mihomo outputs/mihomo/categories/safe
          verify_alias_tree qx outputs/quantumult-x/categories/safe

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 \
            --output "$download_dir/filter_remote.safe.conf" \
            "https://raw.githubusercontent.com/hope140/RuleForge/main/outputs/quantumult-x/filter_remote.safe.conf"
          test -s "$download_dir/filter_remote.safe.conf"
          grep -q '^\[filter_remote\]$' "$download_dir/filter_remote.safe.conf"
